
name: Publicar Practica01 en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos de la practica
        uses: actions/upload-pages-artifact@v4
        with:
          path: Practica01/Ejemplos

      - name: Publicar pagina web
        id: deployment
        uses: actions/deploy-pages@v4
